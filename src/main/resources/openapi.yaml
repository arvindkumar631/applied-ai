  # ════════════════════════════════════════════
  # BOOKS
  # ════════════════════════════════════════════
  /v1/books:
    get:
      tags: [Books]
      summary: List books (paginated, filterable)
      security: []
      operationId: listBooks
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: brandId
          in: query
          schema:
            type: integer
        - name: minPrice
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            format: decimal
        - name: inStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated book list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBookDTO'
    post:
      tags: [Books]
      summary: Create a book (Admin only)
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /v1/books/search:
    get:
      tags: [Books]
      summary: Search books by title, author, or ISBN
      security: []
      operationId: searchBooks
      parameters:
        - name: q
          in: query
          required: true
          description: Search query — matches title, author, or ISBN
          schema:
            type: string
            minLength: 2
            example: fitzgerald
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBookDTO'
        "400":
          $ref: '#/components/responses/ValidationError'

  /v1/books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookIdParam'
    get:
      tags: [Books]
      summary: Get book details
      description: Returns full book details including images, related books, and latest reviews.
      security: []
      operationId: getBookById
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Update a book (Admin only)
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        "200":
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Deactivate a book (Admin only)
      description: Soft deletes the book by setting is_active = false.
      operationId: deleteBook
      responses:
        "204":
          description: Book deactivated
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

