      security: []
      operationId: getRelatedBooks
      responses:
        "200":
          description: Related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummaryDTO'
        "404":
          $ref: '#/components/responses/NotFound'

  /v1/books/{bookId}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookIdParam'
    get:
      tags: [Books]
      summary: Get reviews for a book
      security: []
      operationId: getBookReviews
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema:
