      operationId: clearCart
      responses:
        "204":
          description: Cart cleared
        "401":
          $ref: '#/components/responses/Unauthorized'

  /v1/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      description: If the book is already in the cart, quantity is incremented. Stock is validated.
      operationId: addToCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cart/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CartItemIdParam'
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      responses:
        "200":
          description: Item removed — returns updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════
  # ORDERS
  # ════════════════════════════════════════════
  /v1/orders:
    post:
      tags: [Orders]
      summary: Place order (checkout)
      description: |
        Creates an order from the current cart. Validates stock, applies reward points discount,
        clears the cart, and initiates payment processing.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmationDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Business rule violation (empty cart, insufficient stock, insufficient reward points)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Orders]
      summary: Get order history
      operationId: getOrderHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED]
      responses:
        "200":
          description: Paginated order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrderDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrderById
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    post:
      tags: [Orders]
      summary: Cancel an order
      description: |
        Cancels an order only within **48 hours** of placement.
        Initiates a refund and reverses any redeemed reward points.
        Stock is restored automatically.
      operationId: cancelOrder
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          description: Order cannot be cancelled (outside 48h window or invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/orders/{orderId}/buy-again:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    post:
      tags: [Orders]
      summary: Buy again (re-add order items to cart)
      description: Re-adds all items from a past order to the current cart. Items out of stock are skipped and reported.
      operationId: buyAgain
      responses:
        "200":
          description: Items added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart:
                    $ref: '#/components/schemas/CartDTO'
                  skippedItems:
                    type: array
                    description: Items not added due to being out of stock
                    items:
                      type: object
                      properties:
                        bookId:
                          type: string
                          format: uuid
                        title:
                          type: string
                        reason:
                          type: string
                          example: Out of stock
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════
  # PAYMENTS
  # ════════════════════════════════════════════
  /v1/payments:
    post:
      tags: [Payments]
      summary: Initiate payment
      description: Initiates payment processing for a PENDING order.
      operationId: initiatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/payments/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    get:
      tags: [Payments]
      summary: Get payment status for an order
      operationId: getPaymentByOrderId
      responses:
        "200":
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /v1/payments/{orderId}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    post:
      tags: [Payments]
      summary: Confirm payment
      description: |
        Confirms payment using the transaction reference returned by the payment gateway.
        On success: marks order as CONFIRMED, credits reward points, and sends confirmation notification.
      operationId: confirmPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmationRequest'
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDTO'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'

  # ════════════════════════════════════════════
  # REWARDS
  # ════════════════════════════════════════════
  /v1/rewards/balance:
    get:
      tags: [Rewards]
      summary: Get reward points balance
      operationId: getRewardBalance
      responses:
        "200":
          description: Reward points balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardBalanceDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /v1/rewards/history:
    get:
      tags: [Rewards]
      summary: Get reward points transaction history
      operationId: getRewardHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [EARN, REDEEM, EXPIRE, REVERSE]
      responses:
        "200":
          description: Paginated reward transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRewardTransactionDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ════════════════════════════════════════════
  # RECOMMENDATIONS
  # ════════════════════════════════════════════
  /v1/recommendations:
    get:
      tags: [Recommendations]
      summary: Get personalized recommendations
      description: Returns book recommendations based on the user's purchase history and preferences.
      operationId: getPersonalizedRecommendations
      parameters:
        - name: limit
          in: query
          description: Max number of recommendations to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Personalized recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListDTO'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /v1/recommendations/trending:
    get:
      tags: [Recommendations]
      summary: Get trending books
      description: Returns trending books based on recent sales and views. No authentication required.
      security: []
      operationId: getTrendingBooks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: categoryId
          in: query
          description: Filter trending books by category
          schema:
            type: integer
      responses:
        "200":
          description: Trending books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListDTO'
